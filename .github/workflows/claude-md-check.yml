# Fails a pull request that changes files without updating CLAUDE.md, unless its description says
# why no update is needed. The logic and its tests are in .github/scripts/.
name: CLAUDE.md check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  claude-md:
    name: CLAUDE.md is current
    # Pinned on purpose. ubuntu-latest moves to new images without notice. Move up deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned to a commit, the safest way to name an action. Move up deliberately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the check itself
        run: bash .github/scripts/claude-md-check.test.sh
      - name: Check that CLAUDE.md changed, or the description says why not
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
          bash .github/scripts/claude-md-check.sh < "$RUNNER_TEMP/files.txt"
